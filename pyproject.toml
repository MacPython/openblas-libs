[build-system]
# Minimum requirements for the build system to execute.
requires = [
    "setuptools",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "scipy-openblas64"
# 0.3.34-481-g5137bb62
version = "0.3.34.481.2"
requires-python = ">=3.7"
description = "Provides OpenBLAS for python packaging"
readme = "README.md"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: C++",
  "License :: OSI Approved :: BSD License",
]
# authors = [
# ]
# maintainers = [
# ]
license = {file = "LICENSE.txt"}

[project.urls]
homepage = "https://github.com/MacPython/openblas-libs"
upstream = "https://github.com/OpenMathLib/OpenBLAS"

[tool.setuptools.packages.find]
# scanning for namespace packages is true by default in pyproject.toml, so
# # you do NOT need to include the following line.
namespaces = true
where = ["local"]

[options]
install_requires = "importlib-metadata ~= 1.0 ; python_version < '3.8'"

[tool.setuptools.package-data]
scipy_openblas64 = ["lib/*", "include/*", "lib/pkgconfig/*", "lib/cmake/openblas/*"]

[tool.cibuildwheel]
before-build = "bash ci-before-build.sh"
repair-wheel-command = "bash ci-repair-wheel.sh {dest_dir} {wheel}"
test-command = "cd {package} && bash ci-test.sh"
environment-pass = [
  "NIGHTLY",
  "INTERFACE64",

  # On emulated architectures, RUNNER_ARCH makes manylinux-install-clang install a
  # compiler for the native architecture, which will be much faster.
  "RUNNER_ARCH",
]

[tool.cibuildwheel.android]
# The Linux code in ci-repair-wheel.sh isn't relevant to Android, so use the default
# repair command from the cibuildwheel documentation.
repair-wheel-command = "auditwheel repair --ldpaths {ldpaths} -w {dest_dir} {wheel}"

# Mobile platforms only support Python test-commands, not shell scripts.
test-command = """python -c '
import runpy

def run_module(mod_name):
    runpy.run_module(mod_name, run_name="__main__", alter_sys=True)

try:
    run_module("scipy_openblas32")
except ImportError:
    run_module("scipy_openblas64")
'"""

[project.entry-points.pkg_config]
scipy-openblas = 'scipy_openblas64.lib.pkgconfig'
